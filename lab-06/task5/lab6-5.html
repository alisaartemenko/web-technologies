<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>Завдання 5</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif}
.scene{position:relative;width:520px;height:420px;margin:30px auto;background:#b3b3b3;overflow:hidden}
.card{position:absolute;left:70px;top:0;width:250px;height:340px;background:#000;z-index:2}
.temp{position:absolute;left:20px;bottom:25px;font-size:120px;font-weight:700;color:#bbb;opacity:.85}
.cloud {
  position: absolute;
  left: 150px;      
  top: 90px;
  width: 250px;  
  height: 112px;
  aspect-ratio: 16/9; 
  z-index: 3;
  background: url('cloud.png') center/contain no-repeat;
  mix-blend-mode: screen; 
}
.arrows{position:absolute;left:30px;top:85px;width:110px;height:55px;z-index:3;display:flex;font-size:44px;color:#222;
  background:rgba(120,120,120,.7);opacity:.6;transition:opacity .3s}
.arrows span{flex:1;text-align:center;line-height:55px}
.scene:hover .arrows{opacity:1}
.forecast{position:absolute;left:190px;top:250px;width:310px;height:150px;z-index:1;background:#e0e0e0;
  box-shadow:6px 6px 14px rgba(0,0,0,.35);opacity:.95;display:flex;justify-content:flex-end;align-items:flex-end;gap:12px;padding:0 14px 14px;list-style:none;margin:0}
.forecast li{text-align:center;font-size:18px;font-weight:700;color:#222}
.forecast small{display:block;font-size:11px;font-weight:400;opacity:.4}
.forecast .hidden{visibility:hidden}
</style>
</head>
<body>
<div class="scene">
  <div class="card"><div class="temp">17</div></div>
  <div class="cloud"></div>
  <div class="arrows"><span>←</span><span>→</span></div>
  <ul class="forecast">
    <li class="hidden"><small>Sun</small>0°</li>
    <li><small>Mon</small>17°</li><li><small>Tue</small>19°</li><li><small>Wed</small>16°</li>
    <li><small>Thu</small>18°</li><li><small>Fri</small>21°</li>
  </ul>
</div></body></html>

<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><title>Завдання 1 — варіант 2</title>
<style>
*{box-sizing:border-box}
.wrap{position:relative;width:640px;height:190px;margin:30px auto;font:22px Arial,sans-serif}
.box{position:absolute;width:310px;height:85px;border:2px solid #222;line-height:81px;text-align:center}
.blue{background:#548dd4;color:#fff}
.green{background:#00b050;color:#000}
.b1{left:0;top:0}.b2{left:330px;top:0}
.b3{left:0;top:100px}.b4{left:330px;top:100px}
</style>
</head>
<body>
<div class="wrap">
  <div class="box blue b1">Текст всередині блоку</div>
  <div class="box green b2">Текст всередині блоку</div>
  <div class="box green b3">Текст всередині блоку</div>
  <div class="box blue b4">Текст всередині блоку</div>
</div></body></html>
